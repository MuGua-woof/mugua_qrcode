<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片预览</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#111;
            display:flex;
            flex-direction:column;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }
        h1{color:#fff;margin-bottom:20px;font-size:22px;}
        .img-box{
            max-width:95%;
        }
        img{
            width:100%;
            height:auto;
            border-radius:8px;
        }
    </style>
</head>
<body>
    <h1>图片预览</h1>
    <div class="img-box">
        <img src="https://bee-reg-ab.imagency.cn/p/c91d688ff234a0f673c9b7e678ea6436.png" alt="VX_PAY">
    </div>
</body>
</html>
